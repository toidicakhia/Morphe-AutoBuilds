name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Auto: rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
      app_name:
        description: "Manual: app name (leave empty for auto build)"
        required: false
        type: string
        default: ""
      source:
        description: "Manual: source name"
        required: false
        type: string
        default: "morphe"
      version:
        description: "Manual: specific version (empty for latest)"
        required: false
        type: string
        default: ""
      architecture:
        description: "Manual: architecture"
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: "universal"
      replace_in_release:
        description: "Manual: replace APK in existing GitHub release"
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8192:8191
        options: --shm-size=1gb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start and Wait for FlareSolverr
        run: |
          echo "Waiting for FlareSolverr to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8192/v1 >/dev/null 2>&1; then
              echo "✅ FlareSolverr is ready!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "⚠️ FlareSolverr not ready, continuing anyway..."

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status || true
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "ERROR: GITHUB_TOKEN is empty!"
            exit 1
          fi
          echo "Token is set (length: ${#GITHUB_TOKEN})"
          python scripts/validate_github_auth.py

      - name: Manual Build
        if: ${{ inputs.app_name != '' }}
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ inputs.source }}
          ARCH: ${{ inputs.architecture }}
          CI: true
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "Setting custom version: $VERSION"
            for config_file in "apps/apkmirror/${APP_NAME}.json" "apps/uptodown/${APP_NAME}.json" "apps/apkpure/${APP_NAME}.json"; do
              if [ -f "$config_file" ]; then
                echo "Updating $config_file"
                python3 -c "import json; p='$config_file'; c=json.load(open(p)); c['version']='$VERSION'; json.dump(c, open(p, 'w'), indent=2)"
              fi
            done
          fi

          echo "🚀 Manual build: APP_NAME=$APP_NAME SOURCE=$SOURCE ARCH=$ARCH"
          python -m src

          echo "✅ Build completed. Output files:"
          find . -maxdepth 1 -type f -name "*.apk" 2>/dev/null || echo "No APK files found"

          if [ -n "$VERSION" ]; then
            echo "Resetting version to auto-detect..."
            for config_file in "apps/apkmirror/${APP_NAME}.json" "apps/uptodown/${APP_NAME}.json" "apps/apkpure/${APP_NAME}.json"; do
              if [ -f "$config_file" ]; then
                python3 -c "import json; p='$config_file'; c=json.load(open(p)); c['version']=''; json.dump(c, open(p, 'w'), indent=2)"
              fi
            done
          fi

      - name: Publish Manual Build
        if: ${{ inputs.app_name != '' && inputs.replace_in_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-apks
          find . -maxdepth 1 -name "*.apk" -exec cp {} release-apks/ \;
          count=$(ls -1 release-apks/*.apk 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No APKs found to publish"
            exit 0
          fi
          python scripts/github_publish_release.py --apks-dir release-apks

      - name: Auto Build and Release
        if: ${{ inputs.app_name == '' }}
        env:
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          echo "🔍 Checking for app updates (force_full_rebuild=${FORCE_FULL_REBUILD})..."
          python scripts/check_app_updates.py

          if [ -f build_matrix.json ] && [ "$(jq 'length' build_matrix.json)" -gt 0 ]; then
            HAS_UPDATES=true
          else
            HAS_UPDATES=false
          fi
          echo "has_updates=$HAS_UPDATES"

          if [ "$HAS_UPDATES" != "true" ]; then
            echo "No updates needed. Skipping build."
            exit 0
          fi

          echo "Build matrix:"
          cat build_matrix.json

          mkdir -p build_records release-apks

          FAILURES=0
          while IFS= read -r entry; do
            APP_NAME=$(echo "$entry" | jq -r '.app_name')
            SOURCE=$(echo "$entry" | jq -r '.source')
            ARCH=$(echo "$entry" | jq -r '.arch')
            echo ""
            echo "=== Building $APP_NAME | $SOURCE | $ARCH ==="
            if APP_NAME="$APP_NAME" SOURCE="$SOURCE" ARCH="$ARCH" CI=true GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_TOKEN="$GITHUB_TOKEN" GH_TOKEN="$GH_TOKEN" python -m src; then
              echo "✅ Build succeeded: $APP_NAME/$SOURCE/$ARCH"
              found_apk=false
              for apk in *.apk; do
                [ -f "$apk" ] || continue
                found_apk=true
                echo "Recording build for: $apk"
                APK_PATH="$apk" python scripts/record_build.py || true
                cp "$apk" release-apks/
              done
              if [ "$found_apk" = false ]; then
                echo "⚠️ Build reported success but no APK found for $APP_NAME/$SOURCE/$ARCH"
                FAILURES=$((FAILURES + 1))
              fi
            else
              echo "❌ Build failed: $APP_NAME/$SOURCE/$ARCH"
              FAILURES=$((FAILURES + 1))
            fi
            find . -maxdepth 1 -name "*.apk" -type f -delete 2>/dev/null || true
          done < <(jq -c '.[]' build_matrix.json)

          echo ""
          echo "📁 APKs ready for release:"
          ls -la release-apks/ || true
          built_count=$(ls -1 release-apks/*.apk 2>/dev/null | wc -l)
          echo "📊 Rebuilt APKs: $built_count (failures: $FAILURES)"

          if [ "$built_count" -eq 0 ]; then
            echo "❌ No rebuilt APKs available"
            exit 1
          fi

          echo "🧾 Building manifest.json..."
          python scripts/merge_manifest.py || {
            echo "⚠️ merge_manifest.py failed; continuing without manifest update."
            rm -f manifest.json
          }
          if [ -f manifest.json ]; then
            echo "✅ manifest.json built:"
            python3 -m json.tool manifest.json | head -40
          fi

          echo "🚀 Publishing to GitHub Releases..."
          python scripts/validate_github_auth.py
          python scripts/github_publish_release.py --apks-dir release-apks

          final_count=$(ls -1 release-apks/*.apk 2>/dev/null | wc -l)
          echo "Published $final_count APK(s) plus manifest to the GitHub 'latest' release."

      - name: Cleanup Old Workflow Runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 5
